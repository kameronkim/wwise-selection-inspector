name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/python -m pip install -r requirements-build.txt

      - name: Build app
        run: |
          WSI_PROJECT_ROOT="$PWD" .build-venv/bin/pyinstaller --clean --noconfirm packaging/WwiseSelectionInspector-macos.spec

      - name: Create DMG
        run: |
          mkdir -p dist/dmg-root
          cp -R "dist/Wwise Selection Inspector.app" dist/dmg-root/
          cp "addons/commands/user/install_macos.command" dist/dmg-root/
          cp "addons/commands/user/README.md" "dist/dmg-root/Wwise-Command-Addon-README.md"
          chmod +x dist/dmg-root/install_macos.command
          hdiutil create \
            -volname "Wwise Selection Inspector" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            "dist/WwiseSelectionInspector-macOS.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: WwiseSelectionInspector-macOS
          path: |
            dist/WwiseSelectionInspector-macOS.dmg

  build-windows:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .build-venv
          .\.build-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.build-venv\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Build app
        shell: pwsh
        run: |
          $env:WSI_PROJECT_ROOT = (Get-Location).Path
          .\.build-venv\Scripts\pyinstaller.exe --clean --noconfirm packaging\WwiseSelectionInspector-windows.spec

      - name: Package Windows app
        shell: pwsh
        run: |
          Copy-Item addons\commands\user\install_windows.ps1 dist\WwiseSelectionInspector\install_windows.ps1 -Force
          Copy-Item addons\commands\user\README.md dist\WwiseSelectionInspector\Wwise-Command-Addon-README.md -Force
          Compress-Archive -Path dist\WwiseSelectionInspector\* -DestinationPath dist\WwiseSelectionInspector-Windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: WwiseSelectionInspector-Windows
          path: dist/WwiseSelectionInspector-Windows.zip
